# DE-ON-THI-TA9

<title>Đề trên trời – Tiếng Anh 9</title>
<style>
:root{--bg:#faf9f6;--fg:#1f1f1f;--card:#fff;--bd:#d9d6cf;--ok:#1a7f4b;--okb:#e3f4ea;--no:#b3261e;--nob:#fbe7e5;--ac:#3b5bdb;--mu:#6b6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#ececec;--card:#222428;--bd:#3a3d44;--ok:#6fd49b;--okb:#17352a;--no:#ff8a80;--nob:#3a1d1b;--ac:#8fa6ff;--mu:#a0a0a0}}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.tag{display:inline-block;font-size:12px;background:var(--bd);border-radius:10px;padding:1px 9px;margin-bottom:6px}
.q{font-size:17px;font-weight:600;margin:4px 0 10px}
button{font:inherit;color:inherit}
.o{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:11px 12px;margin:7px 0;cursor:pointer}
.o.ok{border-color:var(--ok);background:var(--okb)}.o.no{border-color:var(--no);background:var(--nob)}

.ex.ok{border-left-color:var(--ok)}.ex.no{border-left-color:var(--no)}
.v{font-weight:700;margin:0 0 6px}.v.ok{color:var(--ok)}.v.no{color:var(--no)}
</style></head><body><main id="a"></main>
<script>
var B=[
['Tính từ','The teacher’s lesson was so ___ that nobody checked their phones.',['interesting','unnecessary','indirect','unpopular'],0,'Đề cương I.31: A lesson that holds students’ attention and makes them want to learn more is interesting.',
['D|interesting (adj) = thú vị, gây hứng thú (interest + -ing). Công thức so + tính từ + that + kết quả: bài học lôi cuốn nên không ai nhìn điện thoại. was là quá khứ đơn nên chỉ cần tính từ làm vị ngữ.','T|unnecessary = không cần thiết. Bẫy: thấy chữ phones rồi nghĩ “không cần”. Nhưng vế đầu mô tả bài học, và kết quả tích cực cần một tính từ tích cực.','N|indirect = gián tiếp (in- + direct), dùng cho đường đi hoặc cách nói. Không mô tả một bài học.','T|unpopular = không được ưa chuộng. Bẫy: nghe hợp với việc không ai quan tâm. Nhưng nếu bài học nhàm thì học sinh mới nhìn điện thoại, ngược với kết quả của câu.'],
'Ra đề có thể đổi thành such an interesting lesson that…; vẫn là so/such + that.','so + tính từ + that = quá … đến nỗi.'],
['Tính từ','Taking the longer, ___ route through the old town cost us twenty minutes.',['peaceful','indirect','professional','typical'],1,'Đề cương I.26: An indirect route does not go straight to the destination.',
['T|peaceful = yên bình. Bẫy: phố cổ nghe yên bình. Nhưng câu nhấn mạnh longer và mất thêm 20 phút, nên cần nghĩa “đi vòng”.','D|indirect = gián tiếp, đi vòng (in- = không + direct = thẳng). Đứng trước danh từ route nên cần tính từ. longer và cost us twenty minutes cho biết đường dài hơn vì không đi thẳng.','N|professional = chuyên nghiệp, dùng cho người hoặc công việc đạt chuẩn nghề. Không mô tả đường đi.','T|typical = điển hình. Bẫy: typical route nghe tự nhiên. Nhưng không giải thích được vì sao tốn thêm 20 phút.'],
'Ra đề có thể đổi route thành way, path hoặc journey; đáp án vẫn là indirect.','in- + direct = không thẳng.'],
['Danh từ chỉ người','Hundreds of ___ joined the Teenovator competition this year.',['villagers','producers','participants','presenters'],2,'Đề cương I.12: A student who takes part in the Teenovator competition is a participant.',
['N|villagers = người sống ở làng. Cuộc thi này không chỉ dành cho người làng.','T|producers = nhà sản xuất. Bẫy: cuộc thi có sản phẩm, ý tưởng nên dễ nghĩ đến producer. Nhưng người dự thi không phải nhà sản xuất.','D|participants (n) = người tham gia (participate + -ant). Hundreds of + danh từ số nhiều nên cần -s. joined = đã tham gia, this year là mốc thời gian. Mẹo: danh từ chỉ người hay có đuôi -er, -or, -ant, -ist.','T|presenters = người trình bày hoặc dẫn chương trình, chỉ một phần nhỏ trong số người dự thi.'],
'Ra đề có thể cho take part in rồi hỏi danh từ chỉ người: participant.','participate đổi thành participant (-ant).'],
['Danh từ','The factory’s monthly ___ rose after it bought new machines.',['description','production','relationship','security'],1,'Đề cương I.4: The workshop uses machines for some steps in the production of com.',
['N|description = bản mô tả. Máy móc mới không làm “bản mô tả” tăng lên.','D|production (n) = sản lượng, quá trình sản xuất (produce + -tion). monthly production = sản lượng hằng tháng. rose là quá khứ của rise = tăng; bought là quá khứ của buy, nên máy mới là nguyên nhân tăng sản lượng.','N|relationship = mối quan hệ. Không đo được bằng tháng và không tăng nhờ máy.','T|security = an ninh. Bẫy: nhà máy thường có bảo vệ nên nghĩ đến security. Nhưng rose after new machines nói về sản lượng.'],
'Ra đề có thể cho cả production, producer, product; phải chọn đúng từ loại.','-tion = danh từ chỉ hành động hoặc kết quả.'],
['Danh từ','I hope to build a friendly ___ with my new classmates.',['equipment','consumption','relationship','entertainment'],2,'Đề cương I.18: Mi hopes to build a friendly relationship with the people living nearby.',
['N|equipment = thiết bị, không đếm được nên không đi với a.','N|consumption = sự tiêu thụ (consume + -tion). Không hợp với classmates.','D|relationship = mối quan hệ. Công thức: build a (friendly) relationship with + người. a nên cần danh từ đếm được số ít; hope to + V là cấu trúc đúng. new classmates là người ta muốn kết bạn.','T|entertainment = giải trí. Bẫy: bạn bè gợi nghĩ vui chơi. Nhưng friendly + with + người cần relationship.'],
'Ra đề có thể đổi sang get along with = have a friendly relationship with.','relation + ship = quan hệ.'],
['Danh từ','Sorting rubbish into the right bins is a ___ every resident should take seriously.',['responsibility','popularity','entertainment','consumption'],0,'Đề cương I.20: Sorting rubbish into the right bins is a responsibility that residents should take seriously.',
['D|responsibility (n) = trách nhiệm (responsible + -ity). a + danh từ số ít. take … seriously = xem trọng, hợp với nghĩa “nghĩa vụ”. every resident = mỗi cư dân, nhấn mạnh việc của mọi người.','T|popularity = sự nổi tiếng. Bẫy: cũng là danh từ đứng sau a. Nhưng không ai “xem trọng” một sự nổi tiếng theo nghĩa nghĩa vụ.','N|entertainment = giải trí, không đứng sau a và không hợp nghĩa.','N|consumption = sự tiêu thụ, không phải thứ ta phải xem trọng như nghĩa vụ.'],
'Ra đề có thể dùng responsible hoặc irresponsible; hãy phân biệt tính từ và danh từ.','responsible đổi thành responsibility (-ity).'],
['Danh từ','Daily ___ of electricity falls when families switch off unused lights.',['occurrence','description','consumption','achievement'],2,'Đề cương I.24: Using less energy reduces a household’s energy consumption.',
['T|occurrence = sự xảy ra. Bẫy: daily occurrence là cụm quen thuộc. Nhưng of electricity cần nghĩa “lượng dùng”.','N|description = bản mô tả. Không liên quan lượng điện.','D|consumption (n) = sự tiêu thụ (consume + -tion). consumption of electricity = lượng điện tiêu thụ. falls = giảm; switch off unused lights là nguyên nhân giảm. when nối hai mệnh đề, cả hai ở hiện tại đơn.','N|achievement = thành tích. Tắt đèn không làm “thành tích điện” giảm.'],
'Ra đề có thể đổi sang energy consumption hoặc water consumption.','consume đổi thành consumption.'],
['Tính từ','The family’s visits to the walking street are ___, happening only from time to time.',['typical','peaceful','occasional','necessary'],2,'Đề cương I.29: The family’s visits to the walking street are occasional, happening only from time to time.',
['T|typical = điển hình. Bẫy: nghe giống “thường lệ”. Nhưng from time to time = thỉnh thoảng, không phải điển hình.','N|peaceful = yên bình. Không nói về tần suất.','D|occasional (adj) = thỉnh thoảng (occasion + -al). Sau are cần tính từ làm vị ngữ. only from time to time giải thích chính xác nghĩa “thỉnh thoảng”. Trạng từ tương ứng là occasionally.','N|necessary = cần thiết. Việc đi chơi phố đi bộ không phải điều bắt buộc.'],
'Ra đề có thể đổi sang trạng từ: visit the walking street ___ (OCCASION) → occasionally.','from time to time = occasional.'],
['Tính từ','A quiet room without interruptions is ___ for studying.',['unpopular','suitable','indirect','unnecessary'],1,'Đề cương I.30: A quiet room without interruptions is suitable for studying.',
['N|unpopular = không được ưa chuộng, không nói về mức phù hợp.','D|suitable (adj) = phù hợp. Công thức: be suitable for + V-ing/danh từ. A quiet room without interruptions là điều kiện tốt, nên phù hợp cho việc học.','N|indirect = gián tiếp, không mô tả một căn phòng.','T|unnecessary = không cần thiết. Bẫy: nghe như phủ nhận vai trò của phòng yên tĩnh. Nhưng nghĩa câu là phòng yên tĩnh có ích cho việc học.'],
'Ra đề có thể đổi sang unsuitable hoặc suitable for + N.','suitable for = phù hợp với.'],
['Cụm động từ','When you finish the test, ___ it to the teacher at the front desk.',['go back','hand in','care for','figure out'],1,'Đề cương II.3: When you finish your paper, you can hand it in and leave the classroom.',
['N|go back = quay lại. Không đi với tân ngữ it.','D|hand in = nộp (bài, đơn). Cấu trúc: hand + it + in hoặc hand in + it; ở đây câu mệnh lệnh nên dùng động từ nguyên mẫu. it = the test, to the teacher chỉ người nhận.','N|care for = chăm sóc. Không dùng cho bài kiểm tra.','T|figure out = tìm ra, hiểu ra. Bẫy: test gợi nghĩ “tìm câu trả lời”. Nhưng câu nói về hành động sau khi làm xong.'],
'Ra đề có thể đổi sang hand in trong bị động: Papers must be handed in.','hand in = nộp vào, hand over = trao lại.'],
['Cụm động từ','At the end of the workshop, the guide asked everyone to ___ their finished pots to the person collecting them.',['hand over','care for','meet up with','figure out'],0,'Đề cương II.6: The teacher asks pupils to hand over their finished pots to the person collecting them.',
['D|hand over = trao, giao cho ai (sang tay người khác). Cấu trúc ask sb to + V: ask everyone to hand over. their finished pots là tân ngữ, to the person collecting them là người nhận. Đây là giao đồ vật, khác với nộp bài (hand in).','N|care for = chăm sóc. Không có nghĩa giao đồ cho người khác.','T|meet up with = gặp theo hẹn. Bẫy: person collecting khiến nghĩ đến việc gặp người. Nhưng tân ngữ là pots, cần động từ chỉ việc trao đi.','N|figure out = tìm ra. Không liên quan việc trao đồ vật.'],
'Ra đề có thể đổi sang bị động hoặc dùng hand in; phải phân biệt hand in và hand over.','over = trao sang tay người khác.'],
['Cụm động từ','Let’s ___ the new gym coach after school and ask about the timetable.',['figure out','meet up with','hand in','care for'],1,'Đề cương II.7: The students plan to meet up with their classmates at the city library.',
['T|figure out = tìm ra. Bẫy: ask about the timetable gợi việc tìm hiểu. Nhưng sau blank là một người (coach), nên cần cụm gặp gỡ.','D|meet up with = gặp (có hẹn trước). Let’s + V nguyên mẫu. the new gym coach là người, after school là thời điểm, and ask about the timetable là mục đích cuộc gặp.','N|hand in = nộp. Không dùng với người.','N|care for = chăm sóc. Không hợp ngữ cảnh gặp để hỏi lịch.'],
'Ra đề có thể đổi sang meet up with + bạn bè hoặc thêm trạng từ chỉ nơi chốn.','meet up = gặp theo hẹn.'],
['Cụm động từ','Visitors usually ___ to their hotel before dinner.',['get along with','hand over','go back','care for'],2,'Đề cương II.4: After exploring the village, the visitors will go back to their hotel.',
['T|get along with = hòa hợp. Bẫy: có cụm with nên dễ chọn. Nhưng sau blank là to their hotel, cần động từ chuyển động.','N|hand over = giao đồ cho ai, không có nghĩa di chuyển.','D|go back = quay về. Visitors số nhiều, usually = hiện tại đơn nên dùng nguyên mẫu go. to their hotel chỉ nơi quay về, before dinner chỉ thời điểm.','N|care for = chăm sóc, không hợp nghĩa di chuyển.'],
'Ra đề có thể đổi thì: will go back, went back; hãy nhớ go–went–gone.','go back = quay lại.'],
['Cụm động từ','Teens should ___ their health by sleeping enough and eating well.',['hand in','meet up with','go back','care for'],3,'Đề cương II.2: Teens need to give care and attention to their bodies (care for).',
['N|hand in = nộp, không đi với health.','N|meet up with = gặp gỡ, không nói về sức khỏe.','N|go back = quay lại, không đi với tân ngữ health.','D|care for = chăm sóc (care for + N). should + V nguyên mẫu. by + V-ing chỉ cách thực hiện: ngủ đủ và ăn uống tốt. Chú ý care for khác care about (quan tâm).'],
'Ra đề có thể đổi sang take care of; cùng nghĩa với care for.','care for = take care of.'],
['Phát âm /æ/ – /ɑː/','Chọn từ có âm của chữ “a” đọc khác: marry, chat, garbage, jam',['marry','chat','garbage','jam'],2,'Đề cương P1 Ex.2: garbage /ɑː/; chat, jam, marry /æ/.',['T|marry /ˈmæri/ đọc /æ/. Bẫy: ar trông giống garbage, nhưng rr tách a khỏi r nên a ngắn /æ/.','N|chat /tʃæt/: a đứng trước t đọc /æ/.','D|garbage /ˈɡɑːbɪdʒ/: ar + phụ âm đọc dài /ɑː/ (như park, chart). Ba từ còn lại a đọc /æ/ nên garbage là từ khác biệt. Nghĩa: rác.','N|jam /dʒæm/: a đứng trước m đọc /æ/.'],'Ra đề đổi bộ từ nhưng giữ quy tắc ar + phụ âm = /ɑː/.','ar + phụ âm = /ɑː/ (park, chart, garbage).'],
['Phát âm /e/ – /æ/','Chọn từ có nguyên âm chính đọc khác: kettle, mental, health, handicraft',['kettle','mental','health','handicraft'],3,'Đề cương P1 Ex.2: kettle, mental, health /e/; handicraft /æ/.',['N|kettle /ˈketl/: e đọc /e/.','N|mental /ˈmentl/: e đọc /e/.','T|health /helθ/ đọc /e/. Bẫy: ea thường đọc /iː/ (eat) nên dễ bị lừa, nhưng health là trường hợp ea đọc /e/.','D|handicraft: chữ a đầu đọc /æ/ (/ˈhændikrɑːft/). Ba từ còn lại đọc /e/ nên handicraft khác biệt. Nghĩa: đồ thủ công.'],'Ra đề có thể thêm từ có ea đọc /e/ như head, bread.','ea đọc /e/ trong health, head, bread.'],
['Phát âm /æ/ – /ɑː/','Chọn từ có âm đầu của chữ “a” đọc khác: park, chart, balanced, artisan',['park','chart','balanced','artisan'],2,'Đề cương P1 Ex.2: balanced /æ/; park, chart, artisan /ɑː/.',['N|park /pɑːk/: ar đọc /ɑː/.','N|chart /tʃɑːt/: ar đọc /ɑː/.','D|balanced /ˈbælənst/: a đọc /æ/, còn -ed sau /s/ đọc /t/. Ba từ còn lại có ar đọc /ɑː/. Nghĩa: cân bằng.','T|artisan /ˌɑːtɪˈzæn/ mở đầu bằng /ɑː/. Bẫy: có thêm chữ a ở cuối nên dễ nghĩ cả từ đọc /æ/, nhưng ta chỉ xét âm đầu.'],'Ra đề đổi từ nhưng vẫn cho cặp /æ/ và /ɑː/.','balanced có a ngắn, artisan mở bằng /ɑː/.'],
['Trọng âm','Chọn từ có trọng âm chính rơi vào âm tiết khác: suburb, remind, pricey, noisy',['suburb','remind','pricey','noisy'],1,'Đề cương P1 Ex.3: suburb 1, remind 2, pricey 1, noisy 1.',['N|suburb nhấn âm 1: SUB-urb (danh từ 2 âm tiết).','D|remind là động từ 2 âm tiết nên nhấn âm 2: re-MIND = nhắc nhở. Ba từ còn lại là danh từ/tính từ nhấn âm 1.','T|pricey nhấn âm 1: PRI-cey. Bẫy: đuôi -ey dễ làm bạn nhấn âm sau như động từ, nhưng đây là tính từ.','N|noisy nhấn âm 1: NOI-sy (tính từ đuôi -y).'],'Ra đề thêm cặp danh–động từ 2 âm tiết.','danh/tính từ: âm 1 · động từ: âm 2.'],
['Trọng âm','Chọn từ có trọng âm chính rơi vào âm tiết khác: population, nationality, facility, opportunity',['population','nationality','facility','opportunity'],2,'Đề cương P1 Ex.4: nhấn âm ngay trước -ion/-ity.',['T|population: pop-u-LA-tion, LA ngay trước -tion nên nhấn âm 3. Bẫy: từ dài nên dễ đoán âm 2.','N|nationality: na-tio-NAL-i-ty, NAL ngay trước -ity nên nhấn âm 3.','D|facility: fa-CIL-i-ty, CIL ngay trước -ity nên nhấn âm 2. Ba từ còn lại nhấn âm 3 nên facility khác biệt. Nghĩa: cơ sở vật chất.','N|opportunity: op-por-TUN-i-ty, TUN ngay trước -ity nên nhấn âm 3.'],'Ra đề giữ quy tắc nhưng đổi từ như authority, majority.','Đếm lùi: ngay trước -ion/-ity là âm nhấn.'],
['Cụm động từ','Local artisans always ___ their techniques to the younger generation.',['get around','hand down','carry out','come down with'],1,'Đề cương P2 Ex.1.3: The skilled artisans always hand down their techniques to the younger generation.',['N|get around = đi lại trong thành phố, không đi với techniques.','D|hand down = truyền lại (kỹ năng, truyền thống) cho thế hệ sau. always chỉ thói quen nên dùng hiện tại đơn, artisans số nhiều nên giữ nguyên hand. their techniques là thứ được truyền, to the younger generation là người nhận.','T|carry out = thực hiện. Bẫy: carry out their techniques nghe như thực hiện kỹ thuật. Nhưng to the younger generation chỉ người nhận nên cần nghĩa truyền lại.','N|come down with = mắc bệnh, không hợp nghĩa.'],'Ra đề có thể đổi sang bị động: have been handed down hoặc passed down.','down = đi xuống các thế hệ sau.'],
['Cụm động từ','Taking the underground is the cheapest way to ___ this crowded city.',['carry out','pass down','get around','cut down on'],2,'Đề cương P2 Ex.1.8: Using the underground metro is the fastest and cheapest way to get around this crowded city.',['N|carry out = thực hiện (kế hoạch), không đi với city.','T|pass down = truyền lại. Bẫy: cùng nhóm với hand down nên dễ nhầm. Nhưng this crowded city là nơi cần đi lại.','D|get around = đi lại, di chuyển quanh nơi nào. the cheapest way to + V = cách rẻ nhất để làm gì. the cheapest là so sánh nhất của cheap. this crowded city là nơi cần đi lại, underground là phương tiện.','N|cut down on = giảm bớt, đi với thứ bị giảm (sugar), không đi với city.'],'Ra đề có thể thêm by bus, by bike sau get around.','get around = đi lại quanh thành phố.'],
['Cụm động từ','My family often ___ the old streets on the first day of every trip.',['comes down with','hands down','runs out of','looks around'],3,'Đề cương P2 Ex.1.4: I love to spend the first day just looking around to see the local architecture.',['N|comes down with = mắc bệnh, không đi với streets.','N|hands down = truyền lại, không dùng để đi xem phố.','T|runs out of = hết. Bẫy: có s hợp chủ ngữ my family. Nhưng nghĩa “hết phố” vô lý.','D|looks around = đi xem, tham quan xung quanh. My family là số ít (it) và often chỉ thói quen nên dùng hiện tại đơn thêm s: looks. the old streets là nơi tham quan, on the first day of every trip nói rõ thói quen mỗi chuyến đi.'],'Ra đề có thể đổi sang V-ing: spend the first day looking around.','look around = ngắm quanh.'],
['Giới từ thời gian','The garbage collector comes ___ 6 p.m. ___ the evening.',['at / in','in / at','on / in','at / on'],0,'Đề cương P2 Ex.2.1: The garbage collector usually comes at 6 p.m. to take the rubbish away.',['D|at + giờ cụ thể (at 6 p.m.); in + buổi trong ngày (in the evening). comes là hiện tại đơn, chủ ngữ số ít, chỉ thói quen.','N|Đảo ngược cả hai: giờ cụ thể cần at, buổi trong ngày cần in.','T|Bẫy: on đi với ngày/thứ nên dễ chọn. Nhưng 6 p.m. cần at, the evening cần in.','N|at 6 p.m. đúng nhưng the evening cần in chứ không phải on.'],'Ra đề có thể thêm at night, on Sunday morning.','at giờ · on ngày · in buổi/tháng/mùa.'],
['Thì','Yesterday, I ___ stuck in a traffic jam and ___ home late.',['gets / comes','got / come','got / came','get / came'],2,'Đề cương P2 Ex.3.4: Yesterday, I got stuck in a traffic jam and came home late.',['N|gets / comes là hiện tại đơn, nhưng Yesterday đòi quá khứ đơn, và chủ ngữ I không thêm s.','T|got đúng nhưng come sai. Bẫy: nhìn vế đầu rồi quên đổi động từ thứ hai về quá khứ (came).','D|Yesterday → quá khứ đơn: got (get–got–gotten), came (come–came–come). Hai động từ nối bằng and phải cùng thì. got stuck = bị kẹt, came home late = về nhà muộn.','N|get sai vì quá khứ cần got; vế sau came thì đúng.'],'Ra đề đổi mốc thời gian: Last night, two days ago.','and nối hai động từ: cùng thì.'],
['Would you mind','Do you mind ___ down the volume? I’m trying to get a good night’s sleep.',['turn','to turn','turning','turned'],2,'Đề cương P2 Ex.4.3: Do you mind turning down the volume?',['N|nguyên mẫu không đứng sau mind.','T|to turn: Bẫy vì quen với want to V. Nhưng mind + V-ing.','D|Do/Would you mind + V-ing…? = Bạn có phiền … không? turning down = vặn nhỏ. I’m trying to… là lý do làm lời nhờ lịch sự.','N|V2/V3 không đi sau mind.'],'Ra đề đổi động từ: opening, closing, helping.','mind + V-ing.'],
['Từ vựng Unit 2','I always avoid driving during the ___ because the roads are packed with cars.',['concrete jungle','rush hour','hygiene','sky train'],1,'Đề cương P4 Ex.6.1: I always avoid driving during the rush hour because the roads are packed with cars.',['T|concrete jungle = khu đô thị bê tông, là nơi chốn. Bẫy: đường đông cũng ở thành phố. Nhưng during cần khoảng thời gian.','D|rush hour = giờ cao điểm. during + the + danh từ chỉ thời gian. packed with cars = đông nghẹt xe, đúng đặc trưng giờ cao điểm. always avoid + V-ing = luôn tránh làm gì.','N|hygiene = vệ sinh, không liên quan.','N|sky train = tàu trên cao, không phải thời điểm.'],'Ra đề có thể đổi sang at rush hour hoặc during rush hour.','rush hour = giờ cao điểm.'],
['Từ vựng Unit 2','The pollution and dust in the city make my skin feel ___.',['pricey','bustling','congested','itchy'],3,'Đề cương P4 Ex.6.4: The pollution and dust in the city make my skin feel itchy.',['N|pricey = đắt đỏ, không mô tả cảm giác.','N|bustling = nhộn nhịp, mô tả nơi chốn.','T|congested = tắc nghẽn. Bẫy: ô nhiễm thành phố gợi tắc. Nhưng skin feel + tính từ chỉ cảm giác.','D|itchy = ngứa (itch + -y). make + tân ngữ + V/adj: make my skin feel itchy. dust và pollution là nguyên nhân gây ngứa.'],'Ra đề có thể đổi bộ phận cơ thể: eyes feel itchy.','itch + y = ngứa.'],
['Từ vựng Unit 2','You can enjoy a great view of the city while travelling on the ___.',['tram','leftover','construction site','sky train'],3,'Đề cương P5 Ex.6.10: You can enjoy a great view of the city while travelling on the sky train.',['T|tram = xe điện chạy sát mặt đường, tầm nhìn không bao quát như tàu trên cao.','N|leftover = đồ ăn thừa, không phải phương tiện.','N|construction site = công trường, không phải phương tiện.','D|sky train = tàu điện chạy trên cao nên nhìn được toàn cảnh thành phố. while + V-ing rút gọn cùng chủ ngữ you. great view of the city xác nhận nghĩa.'],'Ra đề có thể đổi sang underground, tram để so sánh.','sky = trên cao, nên view đẹp.'],
['Từ vựng Unit 3','The school ___ always listens to students’ problems and gives good advice.',['assignment','counsellor','priority','distraction'],1,'Đề cương P5 Ex.7.1: The school counsellor always listens to students’ problems and gives good advice.',['N|assignment = bài tập, không nghe được vấn đề.','D|counsellor (n) = chuyên viên tư vấn (counsel + -or chỉ người). always listens … gives advice là việc của người tư vấn. Chủ ngữ số ít nên động từ thêm s.','N|priority = ưu tiên, không phải người.','T|distraction = sự xao nhãng. Bẫy: cũng là danh từ gắn với học đường. Nhưng không thể nghe và cho lời khuyên.'],'Ra đề có thể thêm counselling hoặc counsel.','counsel + or = người tư vấn.'],
['Từ vựng Unit 3','You should make a list of tasks and give ___ to the most urgent ones.',['due date','mood','priority','anxiety'],2,'Đề cương P5 Ex.7.2: You should make a list of tasks and give priority to the most urgent ones.',['T|due date = hạn nộp. Bẫy: urgent gợi due date. Nhưng give ___ to cần một danh từ trừu tượng chỉ sự ưu tiên.','N|mood = tâm trạng, không đi với give … to.','D|give priority to = ưu tiên cho. priority ở đây không đếm được nên không cần a. the most urgent = so sánh nhất, chỉ việc gấp nhất.','N|anxiety = lo âu, không hợp nghĩa.'],'Ra đề có thể dùng top priority hoặc priorities (số nhiều).','give priority to = ưu tiên.'],
['Từ vựng Unit 3','Taking deep breaths can help you reduce stress and ___ before speaking in public.',['assignment','counsellor','anxiety','priority'],2,'Đề cương P6 Ex.7.13: Taking deep breaths can help you reduce stress and anxiety before speaking in public.',['N|assignment = bài tập, không phải thứ muốn giảm.','N|counsellor = người tư vấn, không phải cảm xúc.','D|anxiety = nỗi lo âu. reduce stress and anxiety: hai danh từ song song sau reduce. Taking deep breaths là chủ ngữ V-ing, help you + V nguyên mẫu.','T|priority = ưu tiên. Bẫy: cũng là danh từ trừu tượng. Nhưng không phải thứ ta muốn giảm bớt.'],'Ra đề có thể đổi sang tính từ anxious hoặc trạng từ anxiously.','anxiety = lo âu.'],
['Từ điển','The data will be extremely valuable ___ medical research.',['to','with','for','of'],2,'Đề cương P6 Ex.4: valuable for somebody/something — The data will be extremely valuable for medical research.',['T|to đi với valuable to somebody (valuable to historians). Bẫy: nhiều bạn nhớ cụm này. Nhưng medical research là việc/vật nên dùng for.','N|with không đi sau valuable.','D|valuable for + something = có giá trị cho …. extremely = rất. will be = tương lai đơn. Công thức từ điển: valuable to + người, valuable for + việc hoặc vật.','N|of không đi sau valuable.'],'Ra đề đổi sang valuable to + người: valuable to historians.','to + người · for + việc.'],
['Cloze','The experience helped strengthen our sense of responsibility and created a stronger feeling of ___ among local people.',['pollution','unity','invention','celebration'],1,'Đề cương P3 (4): created a stronger feeling of unity among local people.',['N|pollution = ô nhiễm, nghĩa tiêu cực.','D|unity = sự đoàn kết (unite + -y). feeling of + danh từ; created a stronger feeling of unity among local people = tình đoàn kết trong cộng đồng. Vế trước nói strengthen responsibility nên cần nghĩa tích cực.','N|invention = phát minh, không phải cảm giác.','T|celebration = lễ ăn mừng. Bẫy: cộng đồng hay tổ chức lễ. Nhưng feeling of + từ chỉ tình cảm gắn kết.'],'Ra đề có thể đổi sang tính từ united hoặc động từ unite.','unite → unity.'],
['Cloze','Thanks to these activities, our neighbourhood has become much ___, attracting more visitors than ever before.',['ordinary','careless','cleaner','narrow'],2,'Đề cương P7 (6): our neighbourhood has become much cleaner, attracting more visitors than ever.',['T|ordinary = bình thường. Bẫy: nghe trung tính nên dễ chọn. Nhưng thu hút nhiều khách hơn bao giờ hết không thể là “bình thường”.','N|careless = cẩu thả, dùng cho người.','D|cleaner = sạch hơn (clean → cleaner). much + so sánh hơn nhấn mạnh mức độ. has become = hiện tại hoàn thành, kết quả còn đến nay. Thanks to + danh từ chỉ nguyên nhân: hoạt động cộng đồng làm khu phố sạch hơn nên thu hút khách.','N|narrow = hẹp, không phải kết quả của hoạt động cộng đồng.'],'Ra đề có thể đổi sang tính từ khác: greener, safer, livelier.','become + so sánh hơn.'],
['Wh- + to V','My friends and I can’t decide ___ this summer vacation.',['where go','where to go','to where go','where going'],1,'Đề cương P7 Ex.1: My friends and I can’t decide where to go this summer vacation.',['N|Thiếu to: sau wh- cần to V.','D|Công thức: wh-word + to V (rút gọn từ wh-word + S + should/can + V). where to go = nên đi đâu. can’t decide + wh- to V = không quyết định được. this summer vacation là mốc thời gian.','N|to where go sai trật tự: wh- phải đứng trước to.','T|where going: Bẫy vì V-ing quen đi với giới từ. Nhưng sau wh- phải dùng to V.'],'Ra đề đổi từ để hỏi: how to, what to, who to.','wh- + to V.'],
['So sánh kép','The more people use public transportation, the ___ air pollution cities will produce.',['less','least','fewer','more less'],0,'Đề cương P7 Ex.3: The more people use public transportation, the less air pollution cities will produce.',['D|Công thức: The + so sánh hơn + S + V, the + so sánh hơn + S + V. air pollution là danh từ không đếm được nên dùng less. cities will produce = tương lai đơn ở vế kết quả.','T|least = ít nhất (so sánh nhất). Bẫy: có the nên tưởng so sánh nhất. Nhưng cấu trúc này cần so sánh hơn.','T|fewer dùng cho danh từ đếm được số nhiều (fewer cars). pollution không đếm được.','N|more less sai: không dùng hai từ so sánh liền nhau.'],'Ra đề đổi sang danh từ đếm được: the fewer cars.','đếm được: fewer · không đếm được: less.'],
['If loại 1','If you ___ English every day, you will become more confident in speaking it.',['practise','will practise','practised','practising'],0,'Đề cương P7 Ex.3.5: As you practice English more, you will become more confident in speaking it.',['D|If loại 1: If + hiện tại đơn, S + will + V. you practise (không s vì chủ ngữ you). every day là dấu hiệu hiện tại. become more confident là kết quả ở tương lai.','T|will practise: Bẫy vì kết quả ở tương lai. Nhưng mệnh đề If không dùng will.','N|practised là quá khứ, thuộc If loại 2 hoặc 3.','N|practising không thể đứng một mình làm động từ chính.'],'Ra đề có thể dùng may hoặc can ở vế kết quả.','If + hiện tại, will + V.'],
['Từ vựng Unit 1','The skilled ___ spent hours carving the intricate wooden lantern.',['garbage collector','police officer','firefighter','artisan'],3,'Đề cương P3 Ex.5.14: The skilled artisan spent hours carving the intricate wooden lantern.',['N|garbage collector = người thu gom rác, không chạm khắc.','N|police officer = công an, không làm đồ thủ công.','T|firefighter = lính cứu hỏa. Bẫy: skilled gợi nghề đặc biệt. Nhưng carving the wooden lantern là việc thủ công.','D|artisan = nghệ nhân. the skilled + danh từ chỉ người. spent hours + V-ing = dành hàng giờ làm gì. carving the intricate wooden lantern = chạm khắc chiếc đèn lồng gỗ tinh xảo.'],'Ra đề có thể đổi sang động từ khác: weaving, painting.','artisan = nghệ nhân.'],
['Cloze','These activities are not only enjoyable ___ they also teach teenagers important life skills.',['so','because','but','or'],2,'Đề cương P3 (2): These activities are not only enjoyable but they also teach teenagers important life skills.',['N|so = vì vậy, chỉ kết quả, phá vỡ cấu trúc not only … but also.','N|because = bởi vì, chỉ nguyên nhân, không nối thêm một ý bổ sung.','D|Công thức: not only A but (also) B = không những A mà còn B. A là enjoyable (thú vị), B là teach important life skills (dạy kỹ năng sống). they also teach: hiện tại đơn, chủ ngữ số nhiều.','T|or = hoặc. Bẫy: or cũng nối hai ý. Nhưng not only luôn đi với but; or đi với either.'],'Ra đề có thể bỏ also hoặc đảo ngữ: Not only are they enjoyable but…','not only … but (also).'],
['Cloze','Last summer, my classmates ___ in a campaign to improve our neighbourhood.',['participate','participated','participating','have participated'],1,'Đề cương P3 (3): Last summer, my classmates participated in a campaign to improve our neighbourhood.',['N|participate là hiện tại đơn, nhưng Last summer là quá khứ.','D|Last summer → quá khứ đơn: participated (thêm -d). participate in = tham gia vào. a campaign to improve our neighbourhood = chiến dịch cải thiện khu phố; my classmates số nhiều nên không thêm s.','N|participating (V-ing) không đứng một mình làm động từ chính.','T|have participated = hiện tại hoàn thành. Bẫy: kết quả còn đến nay. Nhưng Last summer là mốc quá khứ xác định nên không dùng hiện tại hoàn thành.'],'Ra đề có thể đổi mốc: this summer (khi đó dùng hiện tại hoàn thành).','Mốc xác định → quá khứ đơn.'],
['Cloze','Our teacher believes that volunteering can ___ young people to become more confident and responsible citizens.',['encouragement','encouraged','encourage','encouraging'],2,'Đề cương P3 (5): volunteering can encourage young people to become more confident and responsible citizens.',['N|encouragement là danh từ, không đứng sau can.','N|encouraged là quá khứ, nhưng sau can phải là động từ nguyên mẫu.','D|can + V nguyên mẫu: can encourage. encourage sb to V = khuyến khích ai làm gì. more confident and responsible = tự tin hơn và có trách nhiệm hơn. that + mệnh đề: teacher believes that …','T|encouraging là V-ing hoặc tính từ. Bẫy: nghe như tính từ hợp nghĩa. Nhưng sau can cần động từ nguyên mẫu.'],'Ra đề có thể đổi sang word form: ENCOURAGE.','can + V nguyên mẫu.'],
['Cloze','Local organisations regularly invite young people to take part ___ projects such as cleaning parks.',['at','for','in','on'],2,'Đề cương P3 (1): to take part in projects such as cleaning parks.',['N|at đi với địa điểm nhỏ hoặc giờ, không đi với take part.','N|for chỉ mục đích, không đi với take part.','D|take part in = tham gia vào (cụm cố định). invite sb to + V: invite young people to take part. such as cleaning parks = chẳng hạn như dọn công viên. regularly = thường xuyên, hiện tại đơn.','N|on đi với bề mặt hoặc ngày, không đi với take part.'],'Ra đề có thể đổi sang participate in hoặc join.','take part IN.'],
['Đọc hiểu','Passage: Most families in the village work as artisans. To make a perfect pottery product, they follow several careful steps, from preparing the clay and shaping it on a wheel to decorating and baking it. This craft has been passed down for hundreds of years. → What is the main idea of the passage?',['The steps to bake bread in an oven.','The reasons why tourists dislike the village.','Traditional pottery making in a village.','The history of making paper fans.'],2,'Đề cương P4 (Preserving the Traditional Pottery Village), câu 5.',['N|bread không xuất hiện; bài nói về gốm.','N|Bài không nói du khách không thích làng.','D|Ý chính bao quát cả đoạn: nghề gốm truyền thống ở làng (artisans, clay, wheel, passed down for hundreds of years). Công thức: ý chính = chủ đề bao quát, không phải một chi tiết nhỏ.','T|paper fans không có trong bài. Bẫy: cũng là nghề thủ công. Nhưng bài chỉ nói về gốm.'],'Ra đề có thể đổi sang hỏi tiêu đề phù hợp nhất cho đoạn văn.','Ý chính = bao quát cả đoạn.'],
['Đọc hiểu','Passage: We have opened small workshops where visitors can try making their own items. This helps us introduce our local culture and also provides the villagers with extra income. → Which statement is TRUE?',['Tourists can only buy pottery and cannot make it.','Workshops give villagers extra income.','The villagers want to stop making pottery.','The pottery craft just started recently.'],1,'Đề cương P4 câu 4 và 6: visitors can try making their own items; extra income.',['T|Bẫy: nhiều bạn chỉ nghĩ đến du khách mua đồ. Nhưng bài nói visitors can try making their own items.','D|provides the villagers with extra income = mang lại thu nhập thêm cho dân làng. Công thức provide sb with sth = cung cấp cho ai cái gì. Từ đó suy ra nghề thủ công mang lại lợi ích tài chính.','N|Dân làng tự hào và cố gắng giữ nghề, không muốn bỏ.','N|Nghề đã truyền hàng trăm năm, không phải mới bắt đầu.'],'Ra đề có thể hỏi suy luận: Traditional craft brings financial benefits.','provide sb with sth.'],
['Biển báo','Notice: COMMUNITY MEETING – Discussion about alcohol abuse. When: Wednesday, 29th July. Where: at the store. Time: from 9am. Come along to support our community and families. → What does the notice say?',['Residents can discuss alcohol abuse at the community meeting on Wednesday, July 29.','The meeting about alcohol abuse is at the store until 9 a.m.','There is a store sale about alcohol on July 29.','Residents must stay at the store from 9 a.m. every Wednesday.'],0,'Đề cương P6 Ex.9 câu 2: Community Meeting.',['D|Đúng: Discussion about alcohol abuse = thảo luận về lạm dụng rượu; Wednesday 29th July khớp ngày; Residents can… khớp lời mời. Công thức đọc thông báo: đối chiếu chủ đề, ngày, giờ, nơi.','T|until 9 a.m. sai: thông báo ghi from 9am (bắt đầu từ 9 giờ). Bẫy: from và until đảo nghĩa.','N|alcohol abuse là chủ đề thảo luận, không phải bán hàng.','N|Chỉ có một ngày 29 July, không phải mọi thứ Tư; và không bắt buộc ở lại.'],'Ra đề đổi ngày, giờ, địa điểm; hãy đối chiếu từng chi tiết.','from = từ; until = đến.'],
['Biển báo','Where can we see a sign saying “CAUTION: OVERHEAD CRANE”?',['On a beach','At the circus','At the bus stop','On a construction site'],3,'Đề cương P6/P7 Ex.9 câu 5: CAUTION – OVERHEAD CRANE.',['N|beach = bãi biển, không có cần cẩu phía trên đầu.','N|circus = rạp xiếc, không dùng cần cẩu.','T|bus stop = trạm xe buýt. Bẫy: biển báo thường ở nơi công cộng. Nhưng crane (cần cẩu) không có ở trạm xe buýt.','D|overhead crane = cần cẩu trên cao, dùng để nâng vật nặng ở công trường. Công thức đọc biển: Caution = cảnh báo, rồi dùng từ khóa crane để suy ra địa điểm.'],'Ra đề có thể đổi sang biển khác: Danger, Wet floor, No entry.','crane = cần cẩu → công trường.'],
['Hội thoại','Mark: “What was your opinion of the city’s transport system?” – Jane: “___”',['The government is building another station.','I didn’t expect you.','Never say that again.','It was reliable, affordable, and easy to use.'],3,'Đề cương P6 Ex.8 câu 4.',['T|Bẫy: có liên quan đến giao thông. Nhưng câu hỏi xin ý kiến (opinion), không hỏi về dự án.','N|I didn’t expect you = tôi không ngờ là bạn, lạc đề.','N|Never say that again = đừng nói lại, không phải ý kiến.','D|What was your opinion of …? hỏi cảm nhận về điều đã qua nên trả lời bằng tính từ đánh giá, ở quá khứ: It was reliable (đáng tin cậy), affordable (giá phải chăng), easy to use (dễ dùng).'],'Ra đề có thể đổi sang What do you think of…? hoặc How was…?','Hỏi ý kiến → trả lời bằng tính từ đánh giá.'],
['Từ vựng','Successfully reaching a daily cycling goal is a personal ___.',['equipment','description','achievement','consumption'],2,'Đề cương I.8: Successfully reaching a daily cycling goal is a personal achievement.',['N|equipment = thiết bị, không đếm được nên không đi với a.','N|description = bản mô tả.','D|achievement (n) = thành tựu (achieve + -ment). a personal + danh từ đếm được số ít. Successfully reaching a goal = đạt được mục tiêu, nên là một thành tựu cá nhân.','N|consumption = sự tiêu thụ.'],'Ra đề có thể cho động từ ACHIEVE rồi hỏi danh từ.','achieve + ment.'],
['Từ vựng','If construction noise falls by twenty per cent, there is a ___ in noise.',['entertainment','participation','reduction','production'],2,'Đề cương I.9: there is a reduction in noise.',['N|entertainment = giải trí.','N|participation = sự tham gia.','D|reduction (n) = sự giảm (reduce + -tion). a reduction in + danh từ. falls by twenty per cent = giảm hai mươi phần trăm, nên chính là sự giảm.','T|production = sản lượng. Bẫy: cũng là danh từ đuôi -tion. Nhưng falls by 20% nói về giảm.'],'Ra đề có thể đổi sang động từ reduce hoặc a drop in.','reduce → reduction.'],
['Từ vựng','An event that happens in a place is an ___ there.',['consumption','occurrence','equipment','relationship'],1,'Đề cương I.10: An event that happens in a place is an occurrence there.',['N|consumption = sự tiêu thụ, không phải sự kiện.','D|occurrence (n) = sự xảy ra (occur + -ence, gấp đôi r). an + nguyên âm nên dùng an. happens = xảy ra, khớp nghĩa occur.','T|equipment = thiết bị. Bẫy: nghe như thứ có “ở đó”. Nhưng không đếm được nên không đi với an, và không phải một sự kiện.','N|relationship = mối quan hệ.'],'Ra đề có thể dùng rare occurrence hoặc động từ occur.','occur → occurrence (gấp đôi r).'],
['Từ vựng','A student gives a short ___ to the class about a local food.',['relationship','consumption','presentation','security'],2,'Đề cương I.11: A student gives a short presentation to the class.',['N|relationship = mối quan hệ, không đi với give … to the class.','N|consumption = sự tiêu thụ.','D|presentation (n) = bài thuyết trình (present + -ation). give a presentation = thuyết trình. a short + danh từ số ít. about a local food = về một món ăn địa phương.','T|security = an ninh. Bẫy: đuôi -ity quen thuộc nên dễ chọn bừa. Nhưng không liên quan việc nói trước lớp.'],'Ra đề có thể hỏi presenter hoặc present.','present → presentation.'],
['Từ vựng','Away from traffic and building work, the small town is quiet and ___.',['indirect','peaceful','unnecessary','professional'],1,'Đề cương I.13: the small town is quiet and peaceful.',['N|indirect = gián tiếp.','D|peaceful (adj) = yên bình (peace + -ful). quiet and peaceful: hai tính từ song song. Away from traffic and building work = xa tiếng ồn, nên yên bình.','N|unnecessary = không cần thiết.','T|professional = chuyên nghiệp. Bẫy: nghe hợp với town. Nhưng nghĩa không khớp với quiet.'],'Ra đề có thể đổi sang danh từ peace hoặc trạng từ peacefully.','peace + ful = yên bình.'],
['Từ vựng','High crime rates create concerns about public ___ in the city.',['description','entertainment','security','consumption'],2,'Đề cương I.14: High crime rates create concerns about public security.',['N|description = bản mô tả.','N|entertainment = giải trí.','D|security (n) = an ninh (secure + -ity). public security = an ninh công cộng. High crime rates = tỷ lệ tội phạm cao, nên lo ngại về an ninh. concerns about + danh từ.','N|consumption = sự tiêu thụ.'],'Ra đề có thể đổi sang secure hoặc securely.','secure → security.'],
['Từ vựng','The city’s ___ has brought new buildings, roads and services.',['consumption','description','development','participation'],2,'Đề cương I.16: The city’s development has brought new buildings, roads and services.',['N|consumption = sự tiêu thụ.','N|description = bản mô tả.','D|development (n) = sự phát triển (develop + -ment). The city’s + danh từ: sở hữu cách. has brought = hiện tại hoàn thành, kết quả còn đến nay. new buildings, roads and services là kết quả của sự phát triển.','T|participation = sự tham gia. Bẫy: thành phố có nhiều người tham gia. Nhưng không “mang lại” công trình.'],'Ra đề có thể cho DEVELOP và hỏi danh từ.','develop + ment.'],
['Từ vựng','Helena’s suggestion about vehicles near school gates aims to improve children’s ___.',['safety','consumption','popularity','entertainment'],0,'Đề cương I.17: aims to improve children’s safety.',['D|safety (n) = sự an toàn (safe → safety). improve children’s safety = cải thiện an toàn cho trẻ. aims to + V = nhằm mục đích. vehicles near school gates = xe gần cổng trường là mối nguy.','N|consumption = sự tiêu thụ.','N|popularity = sự nổi tiếng.','T|entertainment = giải trí. Bẫy: children gợi nghĩ vui chơi. Nhưng vehicles near gates liên quan đến an toàn.'],'Ra đề có thể đổi sang safe, safely hoặc unsafe.','safe → safety.'],
['Từ vựng','Getting enough sleep is a ___, something students need rather than an optional extra.',['popularity','entertainment','description','necessity'],3,'Đề cương I.28: Getting enough sleep is a necessity.',['N|popularity = sự nổi tiếng.','T|entertainment = giải trí. Bẫy: nghe như thứ ta cần để thư giãn. Nhưng đề đối lập với optional extra.','N|description = bản mô tả.','D|necessity (n) = điều cần thiết (necessary → necessity). a necessity = thứ không thể thiếu. rather than an optional extra = thay vì một thứ tùy chọn thêm vào, nên cần nghĩa bắt buộc.'],'Ra đề có thể đổi sang necessary hoặc unnecessary.','necessary → necessity.'],
['Từ vựng','Unable to choose which task to do first, the student lost time because of his ___.',['security','indecision','participation','production'],1,'Đề cương I.32: the student lost time because of his indecision.',['N|security = an ninh.','D|indecision (n) = sự do dự (in- + decision). Unable to choose = không chọn được, tức là do dự. because of + danh từ: because of his indecision. lost time = mất thời gian.','N|participation = sự tham gia.','N|production = sản lượng.'],'Ra đề có thể đổi sang tính từ indecisive.','in + decision = không quyết định được.'],
['Từ vựng','The constant ___ from building work can disturb nearby residents.',['production','participation','equipment','noise'],3,'Đề cương I.33: The constant noise from building work can disturb nearby residents.',['N|production = sản lượng, không làm phiền cư dân.','N|participation = sự tham gia.','T|equipment = thiết bị. Bẫy: building work có thiết bị. Nhưng disturb residents cần nghĩa tiếng ồn.','D|noise (n) = tiếng ồn. The constant noise from building work: danh từ không đếm được. can disturb = có thể làm phiền. nearby residents = cư dân xung quanh.'],'Ra đề có thể dùng tính từ noisy hoặc trạng từ noisily.','noise → noisy.'],
['Cụm động từ','Students try to ___ which task is most urgent by comparing their deadlines.',['meet up with','go back','figure out','hand over'],2,'Đề cương II.1: Students try to figure out which task is most urgent.',['N|meet up with = gặp theo hẹn.','N|go back = quay lại.','D|figure out = tìm ra, hiểu ra. try to + V. which task is most urgent là mệnh đề wh- làm tân ngữ. by comparing their deadlines = bằng cách so sánh hạn nộp.','N|hand over = trao cho.'],'Ra đề có thể đổi sang work out hoặc find out.','figure out = tìm ra.'],
['Cụm động từ','New residents hope to ___ their neighbours, so the street feels friendly.',['figure out','hand over','hand in','get along with'],3,'Đề cương II.5: New residents hope to get along with their neighbours (= have a friendly relationship with).',['N|figure out = tìm ra.','N|hand over = trao cho.','N|hand in = nộp.','D|get along with = hòa hợp với (= have a friendly relationship with). hope to + V. their neighbours là tân ngữ. so the street feels friendly là kết quả của việc hòa thuận.'],'Ra đề có thể đổi sang get on with.','get along with = get on with.'],
['Wh- + to V','Could you tell me ___ to become friendly with my new neighbours?',['what to do','what do','to do what','what doing'],0,'Đề cương IV.2: Could you tell me what I should do to become friendly with my new neighbours?',['D|Công thức: wh-word + to V, rút gọn từ what I should do. what to do = nên làm gì. Could you tell me + wh- to V = lời nhờ lịch sự. to become friendly with = để thân thiện với.','N|what do thiếu to và sai trật tự câu gián tiếp.','T|to do what là trật tự câu hỏi trực tiếp. Bẫy: sau tell me, wh-word phải đứng trước.','N|what doing sai: sau wh- không dùng V-ing.'],'Ra đề có thể đổi sang how to, where to, who to.','wh- + to V.'],
['Wh- + to V','I do not know how ___ with this problem.',['dealing','deal','to deal','dealt'],2,'Đề cương IV.1: I do not know how I should deal with this problem.',['N|dealing: sau how không dùng V-ing.','N|deal thiếu to.','D|how to deal with = cách xử lý. Công thức: how + to V (rút gọn how I should deal). do not know = không biết (hiện tại đơn phủ định). deal with = giải quyết.','N|dealt là V2/V3, không dùng sau how.'],'Ra đề có thể đổi sang what to do about.','how + to V.'],
['So sánh kép','The ___ the food gets, the more I like it.',['hot','hotter','hottest','more hot'],1,'Đề cương IV.11: As the food gets hotter, I like it more.',['N|hot là nguyên cấp, thiếu so sánh hơn.','D|Công thức: The + so sánh hơn + S + V, the + so sánh hơn + S + V. hot thành hotter (nhân đôi t). the hotter the food gets, the more I like it = thức ăn càng nóng, tôi càng thích.','T|hottest là so sánh nhất. Bẫy: có the nên nghĩ so sánh nhất. Nhưng cấu trúc này cần so sánh hơn.','N|more hot sai vì tính từ ngắn dùng -er.'],'Ra đề có thể đổi sang tính từ dài: the more expensive…','hot → hotter (nhân đôi t).'],
['If loại 1','If you ___ up too late tonight, you might feel tired tomorrow morning.',['will stay','stay','stayed','staying'],1,'Đề cương IV.17: Stay up too late tonight and you might feel tired tomorrow morning.',['T|will stay: Bẫy vì tonight chỉ tương lai. Nhưng mệnh đề If không dùng will.','D|If loại 1: If + hiện tại đơn, S + will/might/can + V. you stay (không s). tonight là tương lai gần nhưng mệnh đề If vẫn dùng hiện tại đơn. might feel = có thể cảm thấy (khả năng).','N|stayed là quá khứ, thuộc If loại 2 hoặc 3.','N|staying không đứng một mình làm động từ chính.'],'Ra đề có thể đổi sang can hoặc may ở vế kết quả.','If + hiện tại, might/will + V.'],
['So sánh kép','The more congested the road ___, the more tired I became.',['became','becomes','becoming','become'],0,'Đề cương IV.12: As the road became more congested, I became more tired.',['D|Công thức: The + so sánh hơn + S + V, the + so sánh hơn + S + V, giữ nguyên thì của câu gốc. Vế sau dùng became (quá khứ) nên vế đầu cũng became. the more congested the road became = đường càng tắc.','T|becomes = hiện tại. Bẫy: nhiều bạn quen dùng hiện tại trong so sánh kép. Nhưng vế sau là quá khứ nên hai vế phải cùng thì.','N|becoming (V-ing) không đứng một mình làm động từ chính.','N|become là nguyên mẫu hoặc V3, sai thì.'],'Ra đề có thể đổi sang hiện tại: the more congested the road becomes.','Hai vế cùng thì.'],

 document.getElementById('s1').onclick=function(){go(B.map(function(_,k){return k}))};

 var o=document.getElementById('o');
 d[2].forEach(function(t,c){var b=document.createElement('button');b.className='o';b.textContent=String.fromCharCode(65+c)+'. '+t;b.onclick=function(){pick(c)};o.appendChild(b)});}

 sv();
 var h='<p class="v '+(ok?'ok':'no')+'">'+(ok?'Đúng!':'Chưa đúng. Đáp án: '+String.fromCharCode(65+d[3])+'. '+esc(d[2][d[3]]))+'</p><div class="ex"><b>Trích từ đề cương</b>'+esc(d[4])+'</div>';
 d[5].forEach(function(t,j){var g=t.charAt(0),lab=g==='D'?'✓ Đáp án đúng':g==='T'?'Câu bẫy: vì sao dễ bị lừa':'Nhắc lại công thức';
  h+='<div class="ex '+(g==='D'?'ok':'no')+'"><b>'+String.fromCharCode(65+j)+'. '+esc(d[2][j])+' · '+lab+(j===c?' · bạn chọn':'')+'</b>'+esc(t.slice(2))+'</div>'});
 h+='<div class="ex"><b>📝 Chuyên gia ra đề: biến dị có thể gặp</b>'+esc(d[6])+'</div><div class="ex"><b>⚡ Chuyên gia hiệu suất: mẹo nhớ</b>'+esc(d[7])+'</div><button class="p" id="n">'+(i+1<Q.length?'Câu tiếp':'Xem kết quả')+'</button>';
